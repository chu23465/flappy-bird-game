<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Cam</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Press Start 2P', monospace;
    color: #5b3a29;
    overflow: hidden;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    position: relative;
  }

  /* --- main launch button --- */
  #openBtn {
    position: relative;
    z-index: 1;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    padding: 18px 30px;
    color: #fff;
    background: #ffcc33;
    border: 5px solid #5b3a29;
    border-radius: 8px;
    box-shadow: 0 7px 0 #b8860b, 0 7px 0 5px rgba(0,0,0,0.15);
    cursor: pointer;
    text-shadow: 1px 1px 0 #b8860b;
    transition: transform 0.05s;
  }
  #openBtn:active {
    transform: translateY(6px);
    box-shadow: 0 1px 0 #b8860b, 0 1px 0 5px rgba(0,0,0,0.15);
  }

  #resultRow {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 20px;
    min-height: 96px;
  }
  .result-box {
    text-align: center;
    color: #fff;
    font-size: 9px;
    text-shadow: 1px 1px 0 #5b3a29;
  }
  .result-box canvas {
    display: none;
    margin-top: 6px;
    width: 80px;
    height: 80px;
    image-rendering: pixelated;
    background:
      linear-gradient(45deg, #cdeaf0 25%, transparent 25%),
      linear-gradient(-45deg, #cdeaf0 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #cdeaf0 75%),
      linear-gradient(-45deg, transparent 75%, #cdeaf0 75%);
    background-size: 12px 12px;
    background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    background-color: #fff;
    border: 4px solid #5b3a29;
    border-radius: 6px;
  }

  /* ================= POPUP PANEL ================= */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay.open { display: flex; }

  #panel {
    position: relative;
    background: linear-gradient(#4ec0ca 0%, #4ec0ca 55%, #74d4b3 55%, #74d4b3 100%);
    border: 6px solid #5b3a29;
    border-radius: 12px;
    padding: 20px 24px 24px;
    width: 340px;
    max-width: 92vw;
    box-shadow: 0 10px 0 rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  #closeBtn {
    position: absolute;
    top: -14px;
    right: -14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #ff7043;
    border: 4px solid #5b3a29;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 0 #b8420b;
  }
  #closeBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b8420b; }

  #panel h2 {
    color: #fff;
    font-size: 13px;
    margin: 2px 0 0;
    text-shadow: 2px 2px 0 #cf7a2c, -1px -1px 0 #5b3a29;
  }

  #status {
    font-size: 8px;
    color: #fff;
    background: rgba(91, 58, 41, 0.35);
    padding: 6px 10px;
    border-radius: 4px;
    text-align: center;
    max-width: 300px;
  }

  .cam-wrap {
    position: relative;
    width: 260px;
    height: 330px;
    background: #000;
    border: 5px solid #5b3a29;
    outline: 5px solid #8bd45a;
    outline-offset: -5px;
    box-shadow: 0 6px 0 #5b3a29;
    overflow: hidden;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }

  .oval-mask {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 95px 130px at center,
      transparent 0%, transparent 96%, rgba(20,10,5,0.78) 100%);
  }
  .oval-outline {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .oval-outline svg { width: 100%; height: 100%; }

  .bird-badge {
    position: absolute;
    top: -20px;
    right: -12px;
    width: 40px;
    height: 34px;
    filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.25));
  }

  .btn-row { display: flex; gap: 12px; }

  #captureBtn, #resetBtn {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 10px 14px;
    color: #fff;
    background: #ffcc33;
    border: 4px solid #5b3a29;
    border-radius: 6px;
    box-shadow: 0 4px 0 #b8860b;
    cursor: pointer;
    text-shadow: 1px 1px 0 #b8860b;
  }
  #captureBtn:active:not(:disabled), #resetBtn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #b8860b;
  }
  #captureBtn:disabled {
    background: #9a9a9a;
    box-shadow: 0 4px 0 #5a5a5a;
    color: #eee;
    cursor: not-allowed;
    text-shadow: none;
  }
  #resetBtn { background: #74d4b3; box-shadow: 0 4px 0 #3f9c7c; }
  #resetBtn:active { box-shadow: 0 1px 0 #3f9c7c; }

  .previews { display: flex; gap: 18px; }
  .preview-box { text-align: center; color: #fff; font-size: 8px; text-shadow: 1px 1px 0 #5b3a29; }
  .preview-box canvas {
    display: block;
    margin-top: 5px;
    width: 72px;
    height: 72px;
    image-rendering: pixelated;
    background:
      linear-gradient(45deg, #cdeaf0 25%, transparent 25%),
      linear-gradient(-45deg, #cdeaf0 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #cdeaf0 75%),
      linear-gradient(-45deg, transparent 75%, #cdeaf0 75%);
    background-size: 10px 10px;
    background-position: 0 0, 0 5px, 5px -5px, -5px 0;
    background-color: #fff;
    border: 3px solid #5b3a29;
    border-radius: 5px;
  }

  #doneBtn {
    display: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 10px 18px;
    color: #fff;
    background: #6bc06b;
    border: 4px solid #5b3a29;
    border-radius: 6px;
    box-shadow: 0 4px 0 #357935;
    cursor: pointer;
  }
  #doneBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #357935; }
</style>
</head>
<body>

<button id="openBtn">TAP TO START</button>

<div id="resultRow">
  <div class="result-box">
    PHOTO 1
    <canvas id="mainPreview1" width="64" height="64"></canvas>
  </div>
  <div class="result-box">
    PHOTO 2
    <canvas id="mainPreview2" width="64" height="64"></canvas>
  </div>
</div>

<!-- ===== popup panel ===== -->
<div id="overlay">
  <div id="panel">
    <button id="closeBtn">X</button>
    <h2>SNAP YOUR PICS</h2>
    <div id="status">Requesting camera...</div>

    <div class="cam-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="oval-mask"></div>
      <div class="oval-outline">
        <svg viewBox="0 0 260 330">
          <ellipse cx="130" cy="165" rx="95" ry="130"
                   fill="none" stroke="#ffcc33" stroke-width="4" stroke-dasharray="9 5"/>
        </svg>
      </div>
      <svg class="bird-badge" viewBox="0 0 46 40">
        <ellipse cx="22" cy="20" rx="16" ry="14" fill="#ffcc33" stroke="#5b3a29" stroke-width="2"/>
        <circle cx="30" cy="15" r="3" fill="#5b3a29"/>
        <path d="M40 18 L46 20 L40 23 Z" fill="#ff7043" stroke="#5b3a29" stroke-width="1.5"/>
        <path d="M8 22 Q18 30 26 22" fill="#f5a623" stroke="#5b3a29" stroke-width="2"/>
      </svg>
    </div>

    <div class="btn-row">
      <button id="captureBtn" disabled>SNAP (0/2)</button>
      <button id="resetBtn">RESET</button>
    </div>

    <div class="previews">
      <div class="preview-box">
        PHOTO 1
        <canvas id="preview1" width="64" height="64"></canvas>
      </div>
      <div class="preview-box">
        PHOTO 2
        <canvas id="preview2" width="64" height="64"></canvas>
      </div>
    </div>

    <button id="doneBtn">DONE</button>
  </div>
</div>

<script>
  // ---------- state ----------
  // The two variables that ultimately hold the 64x64 transparent PNG
  // results (data URLs), available at the top level of the page.
  let photo1 = null;
  let photo2 = null;
  let captureCount = 0;
  let stream = null;

  const OUT_SIZE = 64;
  const OVAL_RX_RATIO = 0.6;
  const OVAL_RY_RATIO = 0.8;
  const BOX_W = 260;
  const BOX_H = 330;

  // ---------- elements ----------
  const openBtn = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const overlay = document.getElementById('overlay');
  const video = document.getElementById('video');
  const captureBtn = document.getElementById('captureBtn');
  const resetBtn = document.getElementById('resetBtn');
  const doneBtn = document.getElementById('doneBtn');
  const statusEl = document.getElementById('status');
  const preview1 = document.getElementById('preview1');
  const preview2 = document.getElementById('preview2');
  const mainPreview1 = document.getElementById('mainPreview1');
  const mainPreview2 = document.getElementById('mainPreview2');

  // ---------- popup open / close ----------
  async function openPanel() {
    overlay.classList.add('open');
    statusEl.textContent = 'Requesting camera...';
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      statusEl.textContent = 'Line your face up in the pipe gap!';
      captureBtn.disabled = false;
    } catch (err) {
      statusEl.textContent = 'Camera access failed: ' + err.message;
    }
  }

  function closePanel() {
    overlay.classList.remove('open');
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  }

  openBtn.addEventListener('click', openPanel);
  closeBtn.addEventListener('click', closePanel);
  doneBtn.addEventListener('click', closePanel);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closePanel();
  });

  // ---------- capture logic ----------
  function captureOvalPNG() {
    const canvas = document.createElement('canvas');
    canvas.width = OUT_SIZE;
    canvas.height = OUT_SIZE;
    const ctx = canvas.getContext('2d');

    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh) return null;

    const camAspect = vw / vh;
    const boxAspect = BOX_W / BOX_H;
    let sx, sy, sw, sh;
    if (camAspect > boxAspect) {
      sh = vh; sw = vh * boxAspect; sx = (vw - sw) / 2; sy = 0;
    } else {
      sw = vw; sh = vw / boxAspect; sx = 0; sy = (vh - sh) / 2;
    }

    ctx.save();
    ctx.beginPath();
    const cx = OUT_SIZE / 2, cy = OUT_SIZE / 2;
    const rx = cx * OVAL_RX_RATIO, ry = cy * OVAL_RY_RATIO;
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.clip();

    ctx.translate(OUT_SIZE, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, OUT_SIZE, OUT_SIZE);
    ctx.restore();

    return canvas;
  }

  captureBtn.addEventListener('click', () => {
    if (captureCount >= 2) return;

    const canvas = captureOvalPNG();
    if (!canvas) {
      statusEl.textContent = 'Not ready yet, flap again in a sec.';
      return;
    }

    const dataUrl = canvas.toDataURL('image/png');
    captureCount++;

    if (captureCount === 1) {
      photo1 = dataUrl;
      preview1.getContext('2d').drawImage(canvas, 0, 0);
      mainPreview1.getContext('2d').drawImage(canvas, 0, 0);
      mainPreview1.style.display = 'block';
      statusEl.textContent = 'Photo 1 in the bag! One more to go.';
    } else {
      photo2 = dataUrl;
      preview2.getContext('2d').drawImage(canvas, 0, 0);
      mainPreview2.getContext('2d').drawImage(canvas, 0, 0);
      mainPreview2.style.display = 'block';
      statusEl.textContent = 'GAME OVER — both photos captured!';
      doneBtn.style.display = 'inline-block';
    }

    captureBtn.textContent = `SNAP (${captureCount}/2)`;
    if (captureCount >= 2) captureBtn.disabled = true;

    console.log('photo1:', photo1);
    console.log('photo2:', photo2);
  });

  resetBtn.addEventListener('click', () => {
    photo1 = null;
    photo2 = null;
    captureCount = 0;
    captureBtn.disabled = false;
    captureBtn.textContent = 'SNAP (0/2)';
    doneBtn.style.display = 'none';
    preview1.getContext('2d').clearRect(0, 0, OUT_SIZE, OUT_SIZE);
    preview2.getContext('2d').clearRect(0, 0, OUT_SIZE, OUT_SIZE);
    mainPreview1.getContext('2d').clearRect(0, 0, OUT_SIZE, OUT_SIZE);
    mainPreview2.getContext('2d').clearRect(0, 0, OUT_SIZE, OUT_SIZE);
    mainPreview1.style.display = 'none';
    mainPreview2.style.display = 'none';
    statusEl.textContent = 'Reset — ready to flap again.';
  });
</script>
</body>
</html>
