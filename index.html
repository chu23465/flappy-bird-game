<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<link rel="dns-prefetch" href="http://res.wx.qq.com">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="format-detection" content="telephone=no">
	<title>Flap With Yourself 🦃</title>
	<script type="application/javascript" src="WeixinApi.js"></script>
	<script type='application/javascript' src="fastclick.js"></script>
</head>
<style>
	@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

	* {
		cursor: pointer;
		-moz-user-select: none;
		-webkit-user-select: none;
		-ms-user-select: none;
		-webkit-tap-highlight-color: transparent;
	}

	html,
	body {
		margin: 0;
		height: 100%;
		font-family: 'Press Start 2P', monospace;
		color: #5b3a29;
		overflow: hidden;
	}

	body {
		min-height: 100vh;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 26px;
		position: relative;
	}

	/* --- main launch button --- */
	#openBtn {
		font-family: 'Press Start 2P', monospace;
		align-self: left;
		justify-content: left;
		font-size: 14px;
		padding: 18px 30px;
		color: #fff;
		background: #ffcc33;
		border: 5px solid #5b3a29;
		border-radius: 8px;
		box-shadow: 0 7px 0 #b8860b, 0 7px 0 5px rgba(0, 0, 0, 0.15);
		cursor: pointer;
		text-shadow: 1px 1px 0 #b8860b;
		transition: transform 0.05s;
	}

	#openBtn:active {
		transform: translateY(6px);
		box-shadow: 0 1px 0 #b8860b, 0 1px 0 5px rgba(0, 0, 0, 0.15);
	}

	/* ================= POPUP PANEL ================= */
	#overlay {
		position: fixed;
		inset: 0;
		background: rgba(0, 0, 0, 0.55);
		display: none;
		align-items: center;
		justify-content: center;
		z-index: 10;
	}

	#overlay.open {
		display: flex;
	}

	#panel {
		position: relative;
		background: linear-gradient(#4ec0ca 0%, #4ec0ca 55%, #74d4b3 55%, #74d4b3 100%);
		border: 6px solid #5b3a29;
		border-radius: 12px;
		padding: 20px 24px 24px;
		width: 340px;
		max-width: 92vw;
		box-shadow: 0 10px 0 rgba(0, 0, 0, 0.25);
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 14px;
	}

	#closeBtn {
		position: absolute;
		top: -14px;
		right: -14px;
		width: 34px;
		height: 34px;
		border-radius: 50%;
		background: #ff7043;
		border: 4px solid #5b3a29;
		color: #fff;
		font-family: 'Press Start 2P', monospace;
		font-size: 12px;
		line-height: 1;
		cursor: pointer;
		box-shadow: 0 4px 0 #b8420b;
	}

	#closeBtn:active {
		transform: translateY(3px);
		box-shadow: 0 1px 0 #b8420b;
	}

	#panel h2 {
		color: #fff;
		font-size: 13px;
		margin: 2px 0 0;
		text-shadow: 2px 2px 0 #cf7a2c, -1px -1px 0 #5b3a29;
	}

	#status {
		font-size: 8px;
		color: #fff;
		background: rgba(91, 58, 41, 0.35);
		padding: 6px 10px;
		border-radius: 4px;
		text-align: center;
		max-width: 300px;
	}

	.cam-wrap {
		position: relative;
		width: 260px;
		height: 330px;
		background: #000;
		border: 5px solid #5b3a29;
		outline: 5px solid #8bd45a;
		outline-offset: -5px;
		box-shadow: 0 6px 0 #5b3a29;
		overflow: hidden;
	}

	video {
		width: 100%;
		height: 100%;
		object-fit: cover;
		transform: scaleX(-1);
	}

	.oval-mask {
		position: absolute;
		inset: 0;
		pointer-events: none;
		background: radial-gradient(ellipse 95px 130px at center,
				transparent 0%, transparent 96%, rgba(20, 10, 5, 0.78) 100%);
	}

	.oval-outline {
		position: absolute;
		inset: 0;
		pointer-events: none;
		display: flex;
		align-items: center;
		justify-content: center;
	}

	.oval-outline svg {
		width: 100%;
		height: 100%;
	}

	.bird-badge {
		position: absolute;
		top: -20px;
		right: -12px;
		width: 40px;
		height: 34px;
		filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.25));
	}

	.btn-row {
		display: flex;
		gap: 12px;
	}

	#captureBtn,
	#resetBtn {
		font-family: 'Press Start 2P', monospace;
		font-size: 9px;
		padding: 10px 14px;
		color: #fff;
		background: #ffcc33;
		border: 4px solid #5b3a29;
		border-radius: 6px;
		box-shadow: 0 4px 0 #b8860b;
		cursor: pointer;
		text-shadow: 1px 1px 0 #b8860b;
	}

	#captureBtn:active:not(:disabled),
	#resetBtn:active {
		transform: translateY(3px);
		box-shadow: 0 1px 0 #b8860b;
	}

	#captureBtn:disabled {
		background: #9a9a9a;
		box-shadow: 0 4px 0 #5a5a5a;
		color: #eee;
		cursor: not-allowed;
		text-shadow: none;
	}

	#resetBtn {
		background: #74d4b3;
		box-shadow: 0 4px 0 #3f9c7c;
	}

	#resetBtn:active {
		box-shadow: 0 1px 0 #3f9c7c;
	}

	.previews {
		display: flex;
		gap: 18px;
	}

	.preview-box {
		text-align: center;
		color: #fff;
		font-size: 8px;
		text-shadow: 1px 1px 0 #5b3a29;
	}

	.preview-box canvas {
		display: block;
		margin-top: 5px;
		width: 72px;
		height: 72px;
		image-rendering: pixelated;
		background:
			linear-gradient(45deg, #cdeaf0 25%, transparent 25%),
			linear-gradient(-45deg, #cdeaf0 25%, transparent 25%),
			linear-gradient(45deg, transparent 75%, #cdeaf0 75%),
			linear-gradient(-45deg, transparent 75%, #cdeaf0 75%);
		background-size: 10px 10px;
		background-position: 0 0, 0 5px, 5px -5px, -5px 0;
		background-color: #fff;
		border: 3px solid #5b3a29;
		border-radius: 5px;
	}

	#doneBtn {
		display: none;
		font-family: 'Press Start 2P', monospace;
		font-size: 9px;
		padding: 10px 18px;
		color: #fff;
		background: #6bc06b;
		border: 4px solid #5b3a29;
		border-radius: 6px;
		box-shadow: 0 4px 0 #357935;
		cursor: pointer;
	}

	#doneBtn:active {
		transform: translateY(3px);
		box-shadow: 0 1px 0 #357935;
	}

	@font-face {
		font-family: "Press Start 2P";
		src: url("PressStart2P.ttf") format('truetype');
	}

	::selection {
		background: transparent;
	}

	::-moz-selection {
		background: transparent;
	}

	.option,
	.mode {
		display: inline-block;
		width: 70px;
		height: 20px;
		background: rgba(255, 255, 255, 0.6);
		position: absolute;
		top: 2px;
		text-align: center;
		font-size: 11px;
		font-family: "Press Start 2P";
		padding-top: 5px;
		z-index: 2;
	}

	.option:hover,
	.mode:hover {
		background: #fff;
	}

	#modes {
		position: absolute;
		top: 28px;
	}

	#easy,
	#flashlight {
		left: 2px;
	}

	#normal,
	#hidden {
		left: 74px;
	}

	#hard {
		left: 146px;
	}

	#avatarOption {
		left: 2px;
		top: 54px;
		width: auto;
		height: auto;
		background: none;
		padding: 0;
	}

	#avatarToggleOption {
		left: 2px;
		top: 118px;
		width: auto;
		height: auto;
		background: none;
		padding: 0;
	}

	#avatarToggleBtn {
		font-family: 'Press Start 2P', monospace;
		font-size: 9px;
		padding: 10px 14px;
		color: #fff;
		background: #74d4b3;
		border: 4px solid #5b3a29;
		border-radius: 6px;
		box-shadow: 0 4px 0 #3f9c7c;
		cursor: pointer;
		text-shadow: 1px 1px 0 #3f9c7c;
	}

	#avatarToggleBtn:active {
		transform: translateY(3px);
		box-shadow: 0 1px 0 #3f9c7c;
	}

	#avatarToggleBtn:disabled {
		background: #9a9a9a;
		box-shadow: 0 4px 0 #5a5a5a;
		color: #eee;
		cursor: not-allowed;
		text-shadow: none;
	}

	canvas {
		-webkit-tap-highlight-color: transparent;
	}
</style>

<body style="padding:0;margin:0;outline:0;overflow: visible">
	<canvas id="canvas">你的浏览器太老了 =_=||</canvas>
	<div id="easy" class="option" style="box-shadow:0 0 0 2px #165CF3">easy</div>
	<div id="normal" class="option">normal</div>
	<div id="hard" class="option">hard</div>
	<div id="avatarOption" class="option"><button id="openBtn">CREATE AVATAR</button></div>
	<div id="avatarToggleOption" class="option"><button id="avatarToggleBtn" disabled>AVATAR: OFF</button></div>

	<!-- ===== popup panel ===== -->
	<div id="overlay">
		<div id="panel">
			<button id="closeBtn">X</button>
			<h2>SNAP YOUR PICS</h2>
			<div id="status">Requesting camera...</div>

			<div class="cam-wrap">
				<video id="video" autoplay playsinline muted></video>
				<div class="oval-mask"></div>
				<div class="oval-outline">
					<svg viewBox="0 0 260 330">
						<ellipse cx="130" cy="165" rx="95" ry="130" fill="none" stroke="#ffcc33" stroke-width="4"
							stroke-dasharray="9 5" />
					</svg>
				</div>
				<svg class="bird-badge" viewBox="0 0 46 40">
					<ellipse cx="22" cy="20" rx="16" ry="14" fill="#ffcc33" stroke="#5b3a29" stroke-width="2" />
					<circle cx="30" cy="15" r="3" fill="#5b3a29" />
					<path d="M40 18 L46 20 L40 23 Z" fill="#ff7043" stroke="#5b3a29" stroke-width="1.5" />
					<path d="M8 22 Q18 30 26 22" fill="#f5a623" stroke="#5b3a29" stroke-width="2" />
				</svg>
			</div>

			<div class="btn-row">
				<button id="captureBtn" disabled>SNAP (0/2)</button>
				<button id="resetBtn">RESET</button>
			</div>

			<div class="previews">
				<div class="preview-box">
					PHOTO 1
					<canvas id="preview1" width="100" height="100"></canvas>
				</div>
				<div class="preview-box">
					PHOTO 2
					<canvas id="preview2" width="100" height="100"></canvas>
				</div>
			</div>

			<button id="doneBtn">DONE</button>
		</div>
	</div>
	<div id="modes">
		<div id="flashlight" class="mode">FL</div>
		<!-- <div id="hidden" class="mode">HD</div> -->
	</div>
	<script>
  // ---------- state ----------
  // The two variables that ultimately hold the 64x64 transparent PNG
  // results (data URLs), available at the top level of the page.
  let photo1 = null;
  let photo2 = null;
  let captureCount = 0;
  let stream = null;

  const OUT_SIZE = 100;
  const OVAL_RX_RATIO = 0.6;
  const OVAL_RY_RATIO = 0.8;
  const BOX_W = 260;
  const BOX_H = 330;

  // ---------- elements ----------
  const openBtn = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const overlay = document.getElementById('overlay');
  const video = document.getElementById('video');
  const captureBtn = document.getElementById('captureBtn');
  const resetBtn = document.getElementById('resetBtn');
  const doneBtn = document.getElementById('doneBtn');
  const statusEl = document.getElementById('status');
  const preview1 = document.getElementById('preview1');
  const preview2 = document.getElementById('preview2');
  const avatarToggleBtn = document.getElementById('avatarToggleBtn');

  // ---------- avatar toggle ----------
  // bird / birdFlap are the sprite Image objects used by the game (fb.js).
  // These are captured lazily so we keep whatever fb.js originally set.
  let birdOriginalSrc = null;
  let birdFlapOriginalSrc = null;
  let avatarOn = false;

  function captureOriginalSprites() {
    if (birdOriginalSrc === null && typeof bird !== 'undefined' && bird) {
      birdOriginalSrc = bird.src;
    }
    if (birdFlapOriginalSrc === null && typeof birdFlap !== 'undefined' && birdFlap) {
      birdFlapOriginalSrc = birdFlap.src;
    }
  }

  function applyAvatarState() {
    if (typeof bird === 'undefined' || typeof birdFlap === 'undefined') return;
    captureOriginalSprites();
    if (avatarOn && window.photo1 && window.photo2) {
      bird.src = window.photo1;
      birdFlap.src = window.photo2;
      avatarToggleBtn.textContent = 'AVATAR: ON';
    } else {
      bird.src = birdOriginalSrc;
      birdFlap.src = birdFlapOriginalSrc;
      avatarToggleBtn.textContent = 'AVATAR: OFF';
    }
  }

  avatarToggleBtn.addEventListener('click', () => {
    if (!window.photo1 || !window.photo2) return;
    avatarOn = !avatarOn;
    applyAvatarState();
  });


  // ---------- popup open / close ----------
  async function openPanel() {
    overlay.classList.add('open');
    statusEl.textContent = 'Requesting camera...';
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      statusEl.textContent = 'Line your face up in the pipe gap!';
      captureBtn.disabled = false;
    } catch (err) {
      statusEl.textContent = 'Camera access failed: ' + err.message;
    }
  }

  function closePanel() {
    overlay.classList.remove('open');
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  }

  openBtn.addEventListener('click', openPanel);
  closeBtn.addEventListener('click', closePanel);
  doneBtn.addEventListener('click', closePanel);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closePanel();
  });

  // ---------- capture logic ----------
  function captureOvalPNG() {
    const canvas = document.createElement('canvas');
    canvas.width = OUT_SIZE;
    canvas.height = OUT_SIZE;
    const ctx = canvas.getContext('2d');

    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh) return null;

    const camAspect = vw / vh;
    const boxAspect = BOX_W / BOX_H;
    let sx, sy, sw, sh;
    if (camAspect > boxAspect) {
      sh = vh; sw = vh * boxAspect; sx = (vw - sw) / 2; sy = 0;
    } else {
      sw = vw; sh = vw / boxAspect; sx = 0; sy = (vh - sh) / 2;
    }

    ctx.save();
    ctx.beginPath();
    const cx = OUT_SIZE / 2, cy = OUT_SIZE / 2;
    const rx = cx * OVAL_RX_RATIO, ry = cy * OVAL_RY_RATIO;
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.clip();

    ctx.translate(OUT_SIZE, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, OUT_SIZE, OUT_SIZE);
    ctx.restore();

    return canvas;
  }

  captureBtn.addEventListener('click', () => {
    if (captureCount >= 2) return;

    const canvas = captureOvalPNG();
    if (!canvas) {
      statusEl.textContent = 'Not ready yet, flap again in a sec.';
      return;
    }

    const dataUrl = canvas.toDataURL('image/png');
    captureCount++;

    if (captureCount === 1) {
      photo1 = dataUrl;
      preview1.getContext('2d').drawImage(canvas, 0, 0);
      statusEl.textContent = 'Photo 1 in the bag! One more to go.';
    } else {
      photo2 = dataUrl;
      preview2.getContext('2d').drawImage(canvas, 0, 0);
      statusEl.textContent = 'GAME OVER — both photos captured!';
      doneBtn.style.display = 'inline-block';
      avatarToggleBtn.disabled = false;
    }

    captureBtn.textContent = `SNAP (${captureCount}/2)`;
    if (captureCount >= 2) captureBtn.disabled = true;

    window.photo1 = photo1;
    window.photo2 = photo2;
  });

  resetBtn.addEventListener('click', () => {
    photo1 = null;
    photo2 = null;
    captureCount = 0;
    captureBtn.disabled = false;
    captureBtn.textContent = 'SNAP (0/2)';
    doneBtn.style.display = 'none';
    preview1.getContext('2d').clearRect(0, 0, OUT_SIZE, OUT_SIZE);
    preview2.getContext('2d').clearRect(0, 0, OUT_SIZE, OUT_SIZE);
    statusEl.textContent = 'Reset — ready to flap again.';

    window.photo1 = null;
    window.photo2 = null;
    avatarToggleBtn.disabled = true;
    avatarOn = false;
    applyAvatarState();
  });
</script>
<script type="application/javascript" src="fb.js"></script>

</body>

</html>
